trigger:
  branches:
    include:
      - feature/ci-cd

stages:
  - stage: Build
    jobs:
      - job: BuildJob
        pool:
          name: 'MyLocalMachine'  # Changed from vmImage

        steps:
          - checkout: self

          # Optional: This just confirms the agent sees your 3.13 version
          - script: python --version
            displayName: 'Verify Python Version'

          - script: |
              python -m py_compile $(git ls-files '*.py')
            displayName: 'Validate Python syntax'

  - stage: Deploy
    dependsOn: Build
    jobs:
      - job: DeployJob
        pool:
          name: 'MyLocalMachine'  # Changed from vmImage

        steps:
          - script: |
              echo "Starting deployment..."
              echo "Deploying application (simulated)"
              echo "Deployment successful!"
            displayName: 'Simulated Deployment'