trigger:
  branches:
    include:
      - feature/ci-cd

stages:
  - stage: Build
    jobs:
      - job: BuildJob
        pool:
          name: 'MyLocalMachine'  # Changed from vmImage

        steps:
          - checkout: self

          - script: |
              "C:\Users\param\AppData\Local\Programs\Python\Python313\python.exe" --version
            displayName: 'Verify Python Version'

          - powershell: |
              $pyFiles = git ls-files '*.py'
              foreach ($file in $pyFiles) {
                  & "C:\Users\param\AppData\Local\Programs\Python\Python313\python.exe" -m py_compile $file
              }
            displayName: 'Validate Python syntax'

  - stage: Deploy
    dependsOn: Build
    jobs:
      - job: DeployJob
        pool:
          name: 'MyLocalMachine'  # Changed from vmImage

        steps:
          - script: |
              echo "Starting deployment..."
              echo "Deploying application (simulated)"
              echo "Deployment successful!"
            displayName: 'Simulated Deployment'