bundle:
  name: uber-streaming-ingestion
variables:
  env:
    default: dev
  prefix:
    default: devuser

targets:

  dev:
    mode: development
    workspace:
      host: https://adb-7405619229783940.0.azuredatabricks.net
    variables:
      env: dev
      prefix: devuser   # static for validation

  stage:
    mode: production
    workspace:
      host: https://adb-7405619229783940.0.azuredatabricks.net
      root_path: /Workspace/Users/param.learns@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: stage
      prefix: ""        # clean naming

  prod:
    mode: production
    workspace:
      host: https://adb-7405619229783940.0.azuredatabricks.net
      root_path: /Workspace/Users/param.learns@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: prod
      prefix: ""        # clean naming

resources:
  jobs:
    ingestion_job:
      name: "${var.prefix}_uber_ingestion_${var.env}"

      tasks:
        - task_key: ingest_task
          spark_python_task:
            python_file: ./src/ingestion/ingest.py

          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 1