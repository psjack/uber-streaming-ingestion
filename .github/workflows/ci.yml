name: CI Pipeline

on:
  push:
    branches:
      - feature/ci-cd

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Validate Python syntax
        run: |
            echo "Starting validation"
            python -m py_compile $(git ls-files '*.py')
            echo "Validation complete"